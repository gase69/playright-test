[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-rds-estimate-python"
version = "0.1.0"
description = "Python CLI generator for AWS RDS Pricing Calculator estimates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "pyright>=1.1.350",
]

[project.scripts]
generate-aws-rds-estimate-py = "generate_aws_rds_estimate:app"

[tool.hatch.build.targets.wheel]
include = ["generate_aws_rds_estimate.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B904", "S110", "E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]


[tool.pyright]

pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["."]
